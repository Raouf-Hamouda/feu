  return '<image href="'+im.src+'" x="'+n1(x)+'" y="'+n1(y)+'" width="'+n1(w)+'" height="'+n1(h)+'" preserveAspectRatio="none"/>';

   ecran plus large : le feu est reconstruit a la largeur de l ecran, bord a bord.
   dans tous les cas le feu deborde du cadre de 80 unites de chaque cote,
   pour que le balancement lateral ne decouvre jamais de blanc. */
var scene = document.getElementById('scene');
function cadre(){
  var vw = window.innerWidth, vh = window.innerHeight;
  if(!vw || !vh) return;
  var vbW, vbX, vbY, vbH;
  if(vw/vh < 1600/900){ vbW = 1600; vbX = 0; vbH = 1600*vh/vw; vbY = 900-vbH; }
  else { vbH = 900; vbY = 0; vbW = 900*vw/vh; vbX = 800-vbW/2; }
  scene.setAttribute('viewBox', n1(vbX)+' '+n1(vbY)+' '+n1(vbW)+' '+n1(vbH));
  var s = vbW/1600, g = Math.max(1,s);
  F.w = vbW + 160;
  F.braises.w = 900*g; F.braises.cx = 800;
  F.accents[0].w = 520*g; F.accents[0].cx = 800 + (430-800)*s;
  F.accents[1].w = 420*g; F.accents[1].cx = 800 + (1250-800)*s;
  gF.innerHTML = feu('fond');
  gM.innerHTML = feu('mid');
  gD.innerHTML = feu('devant');
}
window.addEventListener('resize', cadre);
window.addEventListener('orientationchange', cadre);
cadre();

/* montee des trois plans comme dans la sequence du mot (fond, puis mid, puis devant),
   puis le feu respire sans fin : chaque plan monte et descend de quelques unites,
   dephase, comme un theatre de papier. */
function clamp01(v){ return v<0?0:(v>1?1:v); }
function ease(v){ v=clamp01(v); return v*v*(3-2*v); }
var start = null;
function frame(now){
  if(start===null) start = now;
  var el = (now-start)/1000;
  var fF = ease(el/1.4), fM = ease((el-0.25)/1.4), fD = ease((el-0.5)/1.4);
  var b = Math.max(0, el-2.0);
  /* chaque plan : montee (rise), respiration verticale (y), balancement lateral (x),
     et un etirement vertical depuis la ligne du bas (sy) : les langues lechent vers le haut */
  var yF = 10*Math.sin(b*1.7)      + 4*Math.sin(b*3.9+1.3) + 2*Math.sin(b*6.3+0.7);
  var yM = 14*Math.sin(b*2.0+2.1)  + 5*Math.sin(b*4.4+0.4) + 2.5*Math.sin(b*7.1+3.1);
  var yD = 18*Math.sin(b*2.3+4.2)  + 7*Math.sin(b*5.0+2.6) + 3*Math.sin(b*7.9+1.9);
  var xF = 2*Math.sin(b*1.1+0.5);
  var xM = 4*Math.sin(b*1.4+2.8);
  var xD = 6*Math.sin(b*1.8+5.0);
  var sF = 1 + 0.018*Math.sin(b*2.6+1.1) + 0.008*Math.sin(b*5.7+0.2);
  var sM = 1 + 0.028*Math.sin(b*3.1+3.9) + 0.012*Math.sin(b*6.4+2.2);
  var sD = 1 + 0.040*Math.sin(b*3.6+0.6) + 0.016*Math.sin(b*7.2+4.4);
  function pose(g,x,rise,y,sy){
    g.setAttribute('transform',
      'translate('+n1(x)+','+n1(rise+y)+') translate(800,'+B+') scale(1,'+sy.toFixed(4)+') translate(-800,-'+B+')');
  }
  pose(gF, xF, (1-fF)*260, yF, sF);
  pose(gM, xM, (1-fM)*330, yM, sM);
  pose(gD, xD, (1-fD)*400, yD, sD);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
